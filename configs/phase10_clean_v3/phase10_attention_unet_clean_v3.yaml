experiment_id: phase10_kub_attention_unet_seed42_512_clean_v3
phase: 10
dataset: KUB
manifest_version: phase4_v3
taxonomy_id: kub_size_clean_v3_v1
status: RECONSTRUCTED_AND_READY
authorization_required: Phase-10 Part 1A Attention U-Net clean rerun authorization

model:
  name: attention_unet
  input_channels: 1
  output_channels: 1
  base_channels: 32
  architecture_note: "4-stage additive attention gates on all encoder skip connections"

input_resolution: 512

preprocessing:
  strategy: aspect_ratio_resize_symmetric_pad
  image_interpolation: bilinear
  mask_interpolation: nearest
  image_scaling: [0.0, 1.0]

augmentation:
  horizontal_flip_probability: 0.5
  rotation_degrees: 5.0
  brightness: 0.1
  contrast: 0.1
  vertical_flip: false

loss:
  name: bce_dice
  bce_weight: 0.5
  dice_weight: 0.5
  dice_epsilon: 1.0e-6

optimizer:
  name: AdamW
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4

scheduler:
  name: CosineAnnealingLR
  max_epochs: 100

training:
  max_epochs: 100
  early_stopping_patience: 15
  monitor: val_macro_dice
  threshold: 0.5
  seed: 42
  amp: true
  batch_size: 4
  gradient_accumulation_steps: 1
  effective_batch_size: 4
  num_workers: 0
  pin_memory: true
  persistent_workers: false

device_contract: src.utils.device.get_device(require_cuda=True)
target_contract: src.utils.targets.binarize_mask
single_writer_lock: src.utils.run_lock
allow_test: false

initialization:
  policy: random_kaiming_no_pretrained_weights
  pretrained_weights: false

historical_reference:
  historical_experiment_id: phase10_kub_attention_unet_seed42_512
  historical_manifest_version: phase4_v2
  historical_taxonomy_id: null
  historical_best_epoch: 77
  historical_best_val_macro_dice: 0.7530131340026855
  historical_final_epoch: 92
  historical_stop_reason: EARLY_STOP
