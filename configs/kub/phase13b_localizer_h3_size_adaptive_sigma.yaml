# =============================================================================
# H3 (A_TARGET_SUPPORT_REDESIGN) — DEDICATED KUB LOCALIZER CONFIG
# =============================================================================
# Pre-execution design repair (supervisor ruling): the original H3 design froze a
# size-adaptive sigma mapping that DEGENERATED to the historical fixed sigma=0.75
# for every component. The corrected, NON-DEGENERATE mapping is frozen here:
#
#     sigma_i = clip(0.35 + 0.40 * sqrt(A128_i / A_ref), 0.35, 0.75)
#
# where A128_i is the per-component foreground pixel count in 128-space heatmap
# space and A_ref = 13.0 (p75 of the AUTHORITATIVE per-component 128-space area
# distribution over canonical clean-v3 TRAIN FULL_FIELD, 770 images / 1161
# components; see reports/tables/h3_v2_area_distribution.json, generated by
# scripts/audit/h3_calibrate_size_adaptive_sigma_v2.py). Prior values 14.0 and
# 12.0 relabeled a combined downsampled mask (wrong cardinality) and are
# SUPERSEDED.
#
# Checkpoint selection is frozen to the supply axis:
#     MAX VAL_LOCALIZATION_RECALL (thr=0.10, margin=0.20, top_k=5, nms=0.30),
#     tiebreak MIN VAL_LOSS.
#
# TRAINING IS NOT AUTHORIZED. This config documents the frozen implementation
# contract only; no training run has been (or should be) started from it yet.
# =============================================================================
phase: 13B
seed: 42
resolution: 512
heatmap_resolution: 128
size_adaptive_sigma: true
sigma: 0.75            # historical ceiling / fallback only (ignored when size_adaptive_sigma=true)
sigma_min: 0.35
sigma_max: 0.75
A_ref: 13.0
model:
  name: kub_localizer
  base_channels: 16
  initialization: random_kaiming
  pretrained: false
loss:
  name: CenterNetFocalLoss
  implementation: src.losses.localization.CenterNetFocalLoss
  alpha: 2.0
  beta: 4.0
  dice_weight: 0.0
  dice_term: NONE
  provenance: EXECUTING_HISTORICAL_CODE
  amendment: R2A_LOSS_BINDING
optimizer: {name: AdamW, learning_rate: 0.0001, weight_decay: 0.0001}
scheduler: {name: CosineAnnealingLR, T_max: 100}
training:
  max_epochs: 100
  patience: 15
  effective_batch: 4
  amp: true
# H3 (A_TARGET_SUPPORT_REDESIGN) evaluates EXACTLY ONE fixed decode config per
# epoch. Per-epoch proposal-policy SEARCH is DISABLED on the H3 path. The
# checkpoint-selection rule (max_localization_recall) reads ONLY this config.
proposal_configurations_evaluated_per_epoch: 1
proposal_policy:
  fixed_decode:
    threshold: 0.10
    margin: 0.20
    top_k: 5
    nms_iou: 0.30
  grid_search_enabled: false
  note: "Frozen single decode (thr=0.10 / margin=0.20 / top_k=5 / nms=0.30); no per-epoch search."
coverage_primary: 0.90
checkpoint_selection:
  rule: max_localization_recall
  version: h3_supply_v1
allow_test: false
allow_external: false
