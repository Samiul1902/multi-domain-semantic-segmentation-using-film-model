[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "RA-MedFiLM-Seg++"
version = "0.1.0"
authors = [
  { name="Research Team", email="research@example.com" },
]
description = "Medical image segmentation research project"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "tqdm",
    "pyyaml",
    "scikit-image",
    "tensorboard",
    "seaborn",
    "ipython",
    "nbformat",
    "nbclient",
    "ipykernel"
]
